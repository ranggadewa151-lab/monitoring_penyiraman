<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil Pengguna - Monitoring Kelembapan Tanah Dan Penyiraman Otomatis</title>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #09a35b;
      --primary-hover: #07884c;
      --primary-light: #e8faf0;
      --bg-gradient: linear-gradient(135deg, #f4f9f6 0%, #e9f5ee 100%);
      --text-main: #1f2937;
      --text-muted: #6b7280;
      --card-shadow: 0 10px 25px rgba(0, 0, 0, 0.03);
      --card-shadow-hover: 0 15px 35px rgba(9, 163, 91, 0.1);
      --radius: 20px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      display: flex;
      background: var(--bg-gradient);
      min-height: 100vh;
      color: var(--text-main);
    }

    /* ================= SIDEBAR ================= */
    .sidebar {
      width: 280px;
      height: 100vh;
      background: white;
      padding: 40px 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: sticky;
      top: 0;
      box-shadow: 4px 0 25px rgba(0, 0, 0, 0.02);
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 40px;
    }

    .brand-icon {
      background: var(--primary-light);
      color: var(--primary);
      width: 45px;
      height: 45px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      box-shadow: 0 4px 10px rgba(9, 163, 91, 0.1);
    }

    .logo {
      font-size: 13px;
      font-weight: 700;
      color: var(--primary);
      line-height: 1.3;
    }

    .menu {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .menu a {
      display: flex;
      align-items: center;
      gap: 14px;
      text-decoration: none;
      color: var(--text-muted);
      padding: 14px 18px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 500;
      transition: all 0.3s ease;
    }

    .menu a:hover,
    .menu a.active {
      background: var(--primary-light);
      color: var(--primary);
      font-weight: 600;
      transform: translateX(4px);
    }

    .menu a i {
      font-size: 18px;
    }

    .logout {
      color: #ef4444 !important;
    }
    .logout:hover {
      background: #fef2f2 !important;
      transform: translateX(4px);
    }

    /* ================= MAIN CONTENT ================= */
    .main {
      flex: 1;
      padding: 40px;
      overflow-y: auto;
    }

    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 35px;
    }

    .title {
      font-size: 32px;
      font-weight: 700;
      color: #111827;
      letter-spacing: -0.5px;
    }

    .subtitle {
      color: var(--text-muted);
      margin-top: 4px;
      font-size: 14px;
    }

    /* ================= PROFILE LAYOUT ================= */
    .profile-grid {
      display: grid;
      grid-template-columns: 1fr 1.5fr;
      gap: 30px;
    }

    .profile-card,
    .security-card {
      background: white;
      border-radius: var(--radius);
      padding: 35px;
      box-shadow: var(--card-shadow);
      border: 1px solid rgba(0, 0, 0, 0.02);
      transition: all 0.3s ease;
    }

    .profile-card:hover,
    .security-card:hover {
      box-shadow: var(--card-shadow-hover);
    }

    .profile-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 30px;
    }

    .avatar-wrapper {
      width: 110px;
      height: 110px;
      background: var(--primary-light);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 45px;
      color: var(--primary);
      margin-bottom: 20px;
      box-shadow: 0 8px 20px rgba(9, 163, 91, 0.15);
      border: 3px solid white;
    }

    .profile-name {
      font-size: 22px;
      font-weight: 700;
      color: #111827;
    }

    .profile-role {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 500;
      margin-top: 2px;
    }

    .profile-details {
      border-top: 1.5px solid #f3f4f6;
      padding-top: 25px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .detail-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
    }

    .detail-label {
      color: var(--text-muted);
      font-weight: 500;
    }

    .detail-val {
      font-weight: 600;
      color: #374151;
    }

    /* Security card */
    .card-title {
      font-size: 18px;
      font-weight: 700;
      color: #111827;
      margin-bottom: 25px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1.5px solid #f3f4f6;
      padding-bottom: 15px;
    }
    .card-title i {
      color: var(--primary);
    }

    .input-group {
      margin-bottom: 20px;
    }

    .input-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 600;
      color: #4b5563;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper i {
      position: absolute;
      left: 18px;
      color: var(--text-muted);
      font-size: 16px;
    }

    .input-box {
      width: 100%;
      height: 55px;
      border: 2px solid #e5e7eb;
      border-radius: 14px;
      padding: 0 20px 0 45px;
      font-size: 16px;
      font-weight: 500;
      outline: none;
      transition: all 0.3s ease;
      background: #f9fafb;
    }

    .input-box:focus {
      border-color: var(--primary);
      background: white;
      box-shadow: 0 0 0 4px rgba(9, 163, 91, 0.1);
    }

    .save-btn {
      width: 100%;
      height: 55px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--primary), #059669);
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(9, 163, 91, 0.2);
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .save-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(9, 163, 91, 0.3);
    }

    .save-btn:active {
      transform: translateY(0);
    }

    .save-btn:disabled {
      background: #d1d5db;
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }

    /* ================= TOAST NOTIFICATION ================= */
    .toast {
      position: fixed;
      bottom: 30px;
      right: 30px;
      padding: 14px 22px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 600;
      color: white;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      z-index: 9999;
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    .toast.sukses { background: linear-gradient(135deg, #09a35b, #059669); }
    .toast.error { background: linear-gradient(135deg, #ef4444, #dc2626); }

    /* ================= RESPONSIVE ================= */
    @media (max-width: 900px) {
      body {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        height: auto;
        padding: 24px;
        position: relative;
      }

      .brand {
        margin-bottom: 20px;
        justify-content: center;
      }

      .menu {
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
      }

      .menu a {
        padding: 10px 14px;
        font-size: 13px;
      }

      .main {
        padding: 24px;
      }

      .top-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 15px;
      }

      .profile-grid {
        grid-template-columns: 1fr;
        gap: 20px;
      }
    }
  </style>
</head>
<body>

  <!-- ================= SIDEBAR ================= -->
  <div class="sidebar">
    <div>
      <div class="brand">
        <div class="brand-icon">
          <i class="fa-solid fa-leaf"></i>
        </div>
        <div class="logo" style="font-size: 13px;">
          Monitoring Kelembapan Tanah<br>
          <span style="font-size: 10px; font-weight: 500; color: var(--text-muted);">Dan Penyiraman Otomatis</span>
        </div>
      </div>

      <div class="menu">
        <a href="dashboard.html">
          <i class="fa-solid fa-chart-pie"></i> Dashboard
        </a>
        <a href="riwayat.html">
          <i class="fa-solid fa-history"></i> Riwayat
        </a>
        <a href="aturbatas.html">
          <i class="fa-solid fa-sliders"></i> Atur Batas
        </a>
        <a href="#" class="active">
          <i class="fa-solid fa-user-gear"></i> Profil
        </a>
      </div>
    </div>

    <div class="menu" style="margin-top: 30px;">
      <a href="index.html" class="logout">
        <i class="fa-solid fa-arrow-right-from-bracket"></i> Keluar
      </a>
    </div>
  </div>

  <!-- ================= MAIN CONTENT ================= -->
  <div class="main">
    <div class="top-header">
      <div>
        <div class="title">Profil Pengguna</div>
        <div class="subtitle">Kelola informasi akun dan kata sandi Anda.</div>
      </div>
    </div>

    <!-- ================= PROFILE GRID ================= -->
    <div class="profile-grid">
      <!-- Profile Info -->
      <div class="profile-card">
        <div class="profile-header">
          <div class="avatar-wrapper">
            <i class="fa-solid fa-user"></i>
          </div>
          <div class="profile-name" id="profileName">Memuat...</div>
          <div class="profile-role">Administrator Sistem</div>
        </div>

        <div class="profile-details">
          <div class="detail-item">
            <span class="detail-label">Username</span>
            <span class="detail-val" id="profileUsername">--</span>
          </div>
          <div class="detail-item">
            <span class="detail-label">Status Akun</span>
            <span class="detail-val" style="color: var(--primary);">● Aktif</span>
          </div>
        </div>
      </div>

      <!-- Security / Change Password -->
      <div class="security-card">
        <div class="card-title">
          <i class="fa-solid fa-shield-halved"></i>
          Keamanan Kata Sandi
        </div>

        <div class="input-group">
          <label>PASSWORD LAMA</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-lock"></i>
            <input type="password" class="input-box" id="oldPassword" placeholder="Masukkan password lama">
          </div>
        </div>

        <div class="input-group">
          <label>PASSWORD BARU</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-key"></i>
            <input type="password" class="input-box" id="newPassword" placeholder="Masukkan password baru (min 6 karakter)">
          </div>
        </div>

        <div class="input-group">
          <label>KONFIRMASI PASSWORD BARU</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-circle-check"></i>
            <input type="password" class="input-box" id="confirmPassword" placeholder="Masukkan password baru lagi">
          </div>
        </div>

        <button class="save-btn" id="btnUbah" onclick="ubahPassword()">
          <i class="fa-solid fa-key"></i>
          Perbarui Password
        </button>
      </div>
    </div>
  </div>

  <!-- TOAST NOTIFIKASI -->
  <div class="toast" id="toast">
    <i class="fa-solid fa-check-circle" id="toastIcon"></i>
    <span id="toastMsg"></span>
  </div>

  <!-- ================= FIREBASE LOGIC ================= -->
  <script type="module">
    import { db, ref, get, set } from "./firebase.js";

    // profile username dari localStorage
    const loginUser = localStorage.getItem("loginUser") || "User";
    document.getElementById("profileUsername").innerText = loginUser;
    document.getElementById("profileName").innerText = loginUser;

    // SIMPAN PASSWORD KE FIREBASE
    window.ubahPassword = async function() {
      const oldPassword = document.getElementById("oldPassword").value;
      const newPassword = document.getElementById("newPassword").value;
      const confirmPassword = document.getElementById("confirmPassword").value;
      const btnUbah = document.getElementById("btnUbah");

      if (oldPassword === "" || newPassword === "" || confirmPassword === "") {
        tampilToast("error", "❌ Harap isi semua field password!");
        return;
      }

      if (newPassword.length < 6) {
        tampilToast("error", "❌ Password baru minimal 6 karakter!");
        return;
      }

      if (newPassword !== confirmPassword) {
        tampilToast("error", "❌ Konfirmasi password baru tidak cocok!");
        return;
      }

      btnUbah.disabled = true;
      btnUbah.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Memproses...`;

      try {
        // Ambil data user dari Firebase
        const userRef = ref(db, "users/" + loginUser);
        const snapshot = await get(userRef);

        if (!snapshot.exists()) {
          tampilToast("error", "❌ Akun tidak ditemukan!");
          resetBtn();
          return;
        }

        const userData = snapshot.val();

        // Validasi password lama
        if (userData.password !== oldPassword) {
          tampilToast("error", "❌ Password lama Anda salah!");
          resetBtn();
          return;
        }

        // Simpan password baru ke Firebase
        await set(ref(db, `users/${loginUser}/password`), newPassword);

        // Update di local storage juga untuk cadangan
        localStorage.setItem("password", newPassword);

        tampilToast("sukses", "✅ Password berhasil diperbarui!");
        
        // Reset fields
        document.getElementById("oldPassword").value = "";
        document.getElementById("newPassword").value = "";
        document.getElementById("confirmPassword").value = "";

      } catch (err) {
        console.error("Ubah password error:", err);
        tampilToast("error", "❌ Gagal merubah password.");
      } finally {
        resetBtn();
      }

      function resetBtn() {
        btnUbah.disabled = false;
        btnUbah.innerHTML = `<i class="fa-solid fa-key"></i> Perbarui Password`;
      }
    };

    // TOAST SHOW
    function tampilToast(tipe, pesan) {
      const toast = document.getElementById("toast");
      document.getElementById("toastMsg").innerText = pesan;
      toast.className = `toast ${tipe} show`;
      setTimeout(() => { toast.classList.remove("show"); }, 3000);
    }
  </script>
</body>
</html>
