<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register EcoGarden</title>

  <!-- Font Awesome -->
  <link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins', sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:linear-gradient(to right,#f4f4f4,#dff5e8);
    }

    .register-container{
      width:90%;
      max-width:900px;
      background:white;
      padding:50px 40px;
      border-radius:20px;
      box-shadow:0 10px 30px rgba(0,0,0,0.1);
    }

    .logo{
      text-align:center;
      font-size:45px;
      font-weight:700;
      color:#05a660;
      margin-bottom:10px;
    }

    .subtitle{
      text-align:center;
      letter-spacing:5px;
      color:#5b6575;
      font-size:18px;
      font-weight:600;
      margin-bottom:40px;
    }

    .label{
      width:58%;
      margin:0 auto 10px auto;
      font-size:14px;
      font-weight:600;
      color:#5b6575;
      display:block;
      letter-spacing:2px;
    }

    .input-box{
      width:60%;
      height:65px;
      border:2px solid #e5e5e5;
      border-radius:15px;
      display:flex;
      align-items:center;
      padding:0 20px;
      margin:0 auto 25px auto;
      transition:0.3s;
    }

    .input-box:focus-within{
      border-color:#11b56b;
      box-shadow:0 0 10px rgba(17,181,107,0.2);
    }

    .input-box i{
      font-size:22px;
      color:#11b56b;
      margin-right:15px;
    }

    .input-box input{
      width:100%;
      border:none;
      outline:none;
      font-size:18px;
      background:transparent;
    }

    .register-btn{
      width:30%;
      height:60px;
      border:none;
      border-radius:15px;
      background:#09a35b;
      color:white;
      font-size:24px;
      font-weight:600;
      cursor:pointer;
      transition:0.3s;
      margin:10px auto 0 auto;
      display:block;
    }

    .register-btn:hover{
      background:#07884c;
    }

    .login-link{
      text-align:center;
      margin-top:25px;
      color:#666;
      font-size:15px;
    }

    .login-link a{
      text-decoration:none;
      color:#059657;
      font-weight:600;
    }

    /* ================= ALERT BOX ================= */

    .alert-box{
      display:none;
      width:100%;
      margin:0 auto 20px auto;
      padding:14px 20px;
      border-radius:12px;
      font-size:14px;
      font-weight:500;
      text-align:center;
      animation: fadeIn 0.3s ease;
    }

    .alert-box.error{
      background:#fdecea;
      color:#c0392b;
      border:1.5px solid #e74c3c;
    }

    .alert-box.success{
      background:#e8f8f1;
      color:#1a7a4a;
      border:1.5px solid #2ecc71;
    }

    @keyframes fadeIn{
      from{ opacity:0; transform:translateY(-8px); }
      to  { opacity:1; transform:translateY(0); }
    }

    /* ================= RESPONSIVE ================= */

    @media(max-width:600px){

      body{
        padding:15px;
        height: auto;
        min-height: 100vh;
      }

      .register-container{
        padding:30px 20px;
        margin-top: 20px;
        margin-bottom: 20px;
      }

      .logo{
        font-size:24px;
      }

      .subtitle{
        font-size:14px;
        letter-spacing:3px;
        margin-bottom:30px;
      }

      .label{
        width:100%;
        padding:0 5px;
      }

      .input-box{
        width:100%;
        height:50px;
      }

      .input-box input{
        font-size:14px;
      }

      .register-btn{
        width:100%;
        height:50px;
        font-size:18px;
      }

    }

  </style>
</head>
<script type="module">

  import { db, ref, set, get } from "./firebase.js";

  window.register = async function(){

    const username      = document.getElementById("username").value.trim();
    const password      = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;
    const btnDaftar     = document.getElementById("btnDaftar");

    // ── Validasi input ──────────────────────────────────────────
    if(username === "" || password === "" || confirmPassword === ""){
      showAlert("Semua data harus diisi!", "error");
      return;
    }

    if(username.length < 3){
      showAlert("Username minimal 3 karakter!", "error");
      return;
    }

    if(password.length < 6){
      showAlert("Password minimal 6 karakter!", "error");
      return;
    }

    if(password !== confirmPassword){
      showAlert("Password tidak sama!", "error");
      return;
    }

    // ── Loading state ───────────────────────────────────────────
    btnDaftar.disabled = true;
    btnDaftar.textContent = "Mendaftarkan...";

    try {
      // Cek apakah username sudah ada di Firebase
      const userRef  = ref(db, "users/" + username);
      const snapshot = await get(userRef);

      if(snapshot.exists()){
        showAlert("Username sudah digunakan!", "error");
        btnDaftar.disabled = false;
        btnDaftar.textContent = "Daftar";
        return;
      }

      // Simpan data user ke Firebase Realtime Database
      await set(userRef, {
        username : username,
        password : password,          // ⚠ plain-text — cukup untuk proyek TA
        createdAt: new Date().toISOString()
      });

      showAlert("Register berhasil! Mengarahkan ke halaman login...", "success");

      setTimeout(() => { window.location.href = "index.html"; }, 1800);

    } catch(error) {
      console.error("Register error:", error);
      showAlert("Terjadi kesalahan: " + error.message, "error");
      btnDaftar.disabled = false;
      btnDaftar.textContent = "Daftar";
    }
  };

  // ── Helper: tampilkan notifikasi ────────────────────────────
  function showAlert(msg, type){
    const el = document.getElementById("alertBox");
    el.textContent = msg;
    el.className   = "alert-box " + type;
    el.style.display = "block";
    if(type !== "success") setTimeout(() => { el.style.display = "none"; }, 3500);
  }

</script>
<body>

  <div class="register-container">

    <div class="logo">
      Monitoring Kelembapan Tanah Dan Penyiraman Otomatis.
    </div>

    <div class="subtitle">
      HALAMAN REGISTER
    </div>

    <!-- Username -->
<label class="label">USERNAME</label>

<div class="input-box">
  <i class="fa-solid fa-user"></i>
  <input type="text" id="username"placeholder="Masukkan Username">
</div>

<!-- Password -->
<label class="label">PASSWORD</label>

<div class="input-box">
  <i class="fa-solid fa-lock"></i>
  <input type="password" id="password" placeholder="Masukkan Password">
</div>

<!-- Konfirmasi Password -->
<label class="label">MASUKKAN PASSWORD LAGI</label>

<div class="input-box">
  <i class="fa-solid fa-lock"></i>
  <input type="password" id="confirmPassword" placeholder="Masukkan Password Lagi">
</div>

    <!-- Alert Box -->
    <div id="alertBox" class="alert-box"></div>

    <!-- Button -->
    <button id="btnDaftar" class="register-btn" onclick="register()">
      Daftar
    </button>
    <div class="login-link">
      <a href="index.html">Kembali</a>
    </div>
  </div>

</body>
</html>
