<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atur Ambang Batas - Monitoring Kelembapan Tanah Dan Penyiraman Otomatis</title>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #09a35b;
      --primary-hover: #07884c;
      --primary-light: #e8faf0;
      --bg-gradient: linear-gradient(135deg, #f4f9f6 0%, #e9f5ee 100%);
      --text-main: #1f2937;
      --text-muted: #6b7280;
      --card-shadow: 0 10px 25px rgba(0, 0, 0, 0.03);
      --card-shadow-hover: 0 15px 35px rgba(9, 163, 91, 0.1);
      --radius: 20px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      display: flex;
      background: var(--bg-gradient);
      min-height: 100vh;
      color: var(--text-main);
    }

    /* ================= SIDEBAR ================= */
    .sidebar {
      width: 280px;
      height: 100vh;
      background: white;
      padding: 40px 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: sticky;
      top: 0;
      box-shadow: 4px 0 25px rgba(0, 0, 0, 0.02);
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 40px;
    }

    .brand-icon {
      background: var(--primary-light);
      color: var(--primary);
      width: 45px;
      height: 45px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      box-shadow: 0 4px 10px rgba(9, 163, 91, 0.1);
    }

    .logo {
      font-size: 13px;
      font-weight: 700;
      color: var(--primary);
      line-height: 1.3;
    }

    .menu {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .menu a {
      display: flex;
      align-items: center;
      gap: 14px;
      text-decoration: none;
      color: var(--text-muted);
      padding: 14px 18px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 500;
      transition: all 0.3s ease;
    }

    .menu a:hover,
    .menu a.active {
      background: var(--primary-light);
      color: var(--primary);
      font-weight: 600;
      transform: translateX(4px);
    }

    .menu a i {
      font-size: 18px;
    }

    .logout {
      color: #ef4444 !important;
    }
    .logout:hover {
      background: #fef2f2 !important;
      transform: translateX(4px);
    }

    /* ================= MAIN CONTENT ================= */
    .main {
      flex: 1;
      padding: 40px;
      overflow-y: auto;
    }

    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 35px;
    }

    .title {
      font-size: 32px;
      font-weight: 700;
      color: #111827;
      letter-spacing: -0.5px;
    }

    .subtitle {
      color: var(--text-muted);
      margin-top: 4px;
      font-size: 14px;
    }

    .profile-badge {
      background: white;
      padding: 10px 20px;
      border-radius: 30px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: var(--card-shadow);
      border: 1px solid rgba(0, 0, 0, 0.03);
      transition: all 0.3s ease;
    }
    .profile-badge:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.05);
    }

    .profile-badge i {
      background: var(--primary-light);
      color: var(--primary);
      width: 35px;
      height: 35px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    .profile-badge span {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-main);
    }

    /* ================= FORM LAYOUT ================= */
    .settings-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      margin-bottom: 30px;
    }

    .settings-card {
      background: white;
      border-radius: var(--radius);
      padding: 30px;
      box-shadow: var(--card-shadow);
      border: 1px solid rgba(0, 0, 0, 0.02);
      transition: all 0.3s ease;
    }
    .settings-card:hover {
      box-shadow: var(--card-shadow-hover);
    }

    .card-title {
      font-size: 18px;
      font-weight: 700;
      color: #111827;
      margin-bottom: 25px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1.5px solid #f3f4f6;
      padding-bottom: 15px;
    }
    .card-title i {
      color: var(--primary);
    }

    .input-group {
      margin-bottom: 20px;
    }

    .input-group label {
      display:block;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 600;
      color: #4b5563;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper i {
      position: absolute;
      left: 18px;
      color: var(--text-muted);
      font-size: 16px;
    }

    .input-box {
      width: 100%;
      height: 55px;
      border: 2px solid #e5e7eb;
      border-radius: 14px;
      padding: 0 20px 0 45px;
      font-size: 16px;
      font-weight: 500;
      outline: none;
      transition: all 0.3s ease;
      background: #f9fafb;
    }

    .input-box:focus {
      border-color: var(--primary);
      background: white;
      box-shadow: 0 0 0 4px rgba(9, 163, 91, 0.1);
    }

    /* SAVE BUTTON */
    .btn-container {
      display: flex;
      justify-content: center;
    }

    .save-btn {
      width: 100%;
      max-width: 320px;
      height: 55px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--primary), #059669);
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(9, 163, 91, 0.2);
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .save-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(9, 163, 91, 0.3);
    }

    .save-btn:active {
      transform: translateY(0);
    }

    /* ================= TOAST NOTIFICATION ================= */
    .toast {
      position: fixed;
      bottom: 30px;
      right: 30px;
      padding: 14px 22px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 600;
      color: white;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      z-index: 9999;
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    .toast.sukses { background: linear-gradient(135deg, #09a35b, #059669); }
    .toast.error { background: linear-gradient(135deg, #ef4444, #dc2626); }

    /* ================= RESPONSIVE ================= */
    @media (max-width: 900px) {
      body {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        height: auto;
        padding: 24px;
        position: relative;
      }

      .brand {
        margin-bottom: 20px;
        justify-content: center;
      }

      .menu {
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
      }

      .menu a {
        padding: 10px 14px;
        font-size: 13px;
      }

      .main {
        padding: 24px;
      }

      .top-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 15px;
      }

      .profile-badge {
        width: 100%;
        justify-content: center;
      }

      .settings-grid {
        grid-template-columns: 1fr;
        gap: 20px;
      }
    }
  </style>
</head>
<body>

  <!-- ================= SIDEBAR ================= -->
  <div class="sidebar">
    <div>
      <div class="brand">
        <div class="brand-icon">
          <i class="fa-solid fa-leaf"></i>
        </div>
        <div class="logo" style="font-size: 13px;">
          Monitoring Kelembapan Tanah<br>
          <span style="font-size: 10px; font-weight: 500; color: var(--text-muted);">Dan Penyiraman Otomatis</span>
        </div>
      </div>

      <div class="menu">
        <a href="dashboard.html">
          <i class="fa-solid fa-chart-pie"></i> Dashboard
        </a>
        <a href="riwayat.html">
          <i class="fa-solid fa-history"></i> Riwayat
        </a>
        <a href="#" class="active">
          <i class="fa-solid fa-sliders"></i> Atur Batas
        </a>
        <a href="profil.html">
          <i class="fa-solid fa-user-gear"></i> Profil
        </a>
      </div>
    </div>

    <div class="menu" style="margin-top: 30px;">
      <a href="index.html" class="logout">
        <i class="fa-solid fa-arrow-right-from-bracket"></i> Keluar
      </a>
    </div>
  </div>

  <!-- ================= MAIN CONTENT ================= -->
  <div class="main">
    <div class="top-header">
      <div>
        <div class="title">Atur Ambang Batas</div>
        <div class="subtitle">Atur batas kelembapan untuk sistem otomasi penyiraman.</div>
      </div>

      <div class="profile-badge">
        <i class="fa-solid fa-user"></i>
        <span id="profileUsername">Memuat...</span>
      </div>
    </div>

    <!-- ================= SETTINGS FORM ================= -->
    <div class="settings-grid">
      <!-- SENSOR 1 -->
      <div class="settings-card">
        <div class="card-title">
          <i class="fa-solid fa-droplet"></i>
          Ambang Batas Sensor 1
        </div>

        <div class="input-group">
          <label>Batas Kering (%)</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-temperature-empty"></i>
            <input type="number" class="input-box" id="kering1" placeholder="Contoh: 30">
          </div>
        </div>

        <div class="input-group">
          <label>Batas Lembap (%)</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-temperature-half"></i>
            <input type="number" class="input-box" id="lembap1" placeholder="Contoh: 60">
          </div>
        </div>
      </div>

      <!-- SENSOR 2 -->
      <div class="settings-card">
        <div class="card-title">
          <i class="fa-solid fa-droplet"></i>
          Ambang Batas Sensor 2
        </div>

        <div class="input-group">
          <label>Batas Kering (%)</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-temperature-empty"></i>
            <input type="number" class="input-box" id="kering2" placeholder="Contoh: 30">
          </div>
        </div>

        <div class="input-group">
          <label>Batas Lembap (%)</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-temperature-half"></i>
            <input type="number" class="input-box" id="lembap2" placeholder="Contoh: 60">
          </div>
        </div>
      </div>
    </div>

    <!-- BUTTON CONTAINER -->
    <div class="btn-container">
      <button class="save-btn" onclick="simpanData()">
        <i class="fa-solid fa-floppy-disk"></i>
        Simpan Pengaturan
      </button>
    </div>
  </div>

  <!-- TOAST NOTIFIKASI -->
  <div class="toast" id="toast">
    <i class="fa-solid fa-check-circle" id="toastIcon"></i>
    <span id="toastMsg"></span>
  </div>

  <!-- ================= FIREBASE LOGIC ================= -->
  <script type="module">
    import { db, ref, set, get } from "./firebase.js";

    // profile username dari localStorage
    const loginUser = localStorage.getItem("loginUser") || "User";
    document.getElementById("profileUsername").innerText = loginUser;

    // BACA BATAS DARI FIREBASE
    // Sensor 1
    const sensor1Ref = ref(db, "/sensor1");
    get(sensor1Ref).then((snapshot) => {
      const data = snapshot.val();
      if (data) {
        document.getElementById("kering1").value = data.bataskering || "";
        document.getElementById("lembap1").value = data.batslembab || "";
      }
    });

    // Sensor 2
    const sensor2Ref = ref(db, "/sensor2");
    get(sensor2Ref).then((snapshot) => {
      const data = snapshot.val();
      if (data) {
        document.getElementById("kering2").value = data.bataskering || "";
        document.getElementById("lembap2").value = data.batslembab || "";
      }
    });

    // SIMPAN BATAS KE FIREBASE
    window.simpanData = function() {
      const kering1 = Number(document.getElementById("kering1").value);
      const lembap1 = Number(document.getElementById("lembap1").value);
      const kering2 = Number(document.getElementById("kering2").value);
      const lembap2 = Number(document.getElementById("lembap2").value);

      if (!kering1 && !lembap1 && !kering2 && !lembap2) {
        tampilToast("error", "❌ Harap isi minimal satu batas kelembapan!");
        return;
      }

      const updates = [];
      updates.push(set(ref(db, "/sensor1/bataskering"), kering1));
      updates.push(set(ref(db, "/sensor1/batslembab"), lembap1));
      updates.push(set(ref(db, "/sensor2/bataskering"), kering2));
      updates.push(set(ref(db, "/sensor2/batslembab"), lembap2));

      Promise.all(updates)
        .then(() => {
          tampilToast("sukses", "✅ Ambang batas berhasil disimpan!");
        })
        .catch((error) => {
          console.error("Gagal menyimpan:", error);
          tampilToast("error", "❌ Gagal menyimpan batas ke Firebase.");
        });
    }

    // TOAST SHOW
    function tampilToast(tipe, pesan) {
      const toast = document.getElementById("toast");
      document.getElementById("toastMsg").innerText = pesan;
      toast.className = `toast ${tipe} show`;
      setTimeout(() => { toast.classList.remove("show"); }, 3000);
    }
  </script>
</body>
</html>
